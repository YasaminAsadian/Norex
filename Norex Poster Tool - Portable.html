<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Norex Poster Tool</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0b1728;
      --muted: #5a6678;
      --line: #d8dde5;
      --panel: #ffffff;
      --page: #eef2f7;
      --accent: #b8872b;
      --accent-dark: #815915;
      --danger: #c8121c;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(360px, 480px) minmax(420px, 1fr);
      gap: 22px;
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .controls,
    .preview {
      min-width: 0;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(16, 30, 54, 0.08);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #c8d0dc;
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fbfcfe;
      font-size: 16px;
    }

    input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(184, 135, 43, 0.18);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-align: left;
      padding: 0 6px 8px;
    }

    td {
      border-top: 1px solid var(--line);
      padding: 8px 6px;
      vertical-align: middle;
    }

    td:first-child {
      width: 74px;
      font-weight: 800;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 44px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 800;
      touch-action: manipulation;
    }

    .primary {
      color: #ffffff;
      background: #081a30;
      border-color: #081a30;
    }

    .secondary {
      color: var(--ink);
      background: #f9fafc;
      border-color: #c8d0dc;
    }

    .primary:hover,
    .secondary:hover {
      filter: brightness(0.96);
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .preview-frame {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    canvas {
      display: none;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(16, 30, 54, 0.2);
      background: #dfe6ef;
    }

    .poster-image {
      display: none;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(16, 30, 54, 0.2);
      background: #dfe6ef;
    }

    #template-source {
      display: block !important;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(16, 30, 54, 0.2);
      background: #dfe6ef;
    }

    body.js-ready #template-source {
      display: none !important;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 14px;
      }

      .field-grid,
      .actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .app {
        padding: 10px;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 22px;
      }

      .section {
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 7px;
      }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
      }

      thead {
        display: none;
      }

      tr {
        display: grid;
        grid-template-columns: 64px 1fr 1fr;
        gap: 8px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      tr:first-child {
        border-top: 0;
        padding-top: 0;
      }

      td {
        border-top: 0;
        padding: 0;
      }

      td:first-child {
        width: auto;
        align-self: end;
        padding-bottom: 12px;
        font-size: 17px;
      }

      td[data-label]::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      input {
        min-height: 46px;
        font-size: 17px;
      }

      .primary,
      .secondary {
        min-height: 48px;
      }

      .preview-frame {
        max-width: 100%;
      }

      canvas {
        border-radius: 6px;
        box-shadow: 0 10px 28px rgba(16, 30, 54, 0.18);
      }

      .poster-image {
        border-radius: 6px;
        box-shadow: 0 10px 28px rgba(16, 30, 54, 0.18);
      }

      #template-source {
        border-radius: 6px;
        box-shadow: 0 10px 28px rgba(16, 30, 54, 0.18);
      }
    }

    @media (max-width: 390px) {
      tr {
        grid-template-columns: 1fr 1fr;
      }

      td:first-child {
        grid-column: 1 / -1;
        padding-bottom: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="controls">
      <h1>Norex Poster Tool</h1>

      <div class="section">
        <div class="field-grid">
          <label>
            Date
            <input id="date" type="date" value="2026-06-30" />
          </label>
          <label>
            Output name
            <input id="filename" type="text" value="norex-currency-rates.png" />
          </label>
        </div>
      </div>

      <div class="section">
        <table>
          <thead>
            <tr>
              <th>Currency</th>
              <th>Sell</th>
              <th>Buy</th>
            </tr>
          </thead>
          <tbody id="rates">
            <tr><td>USD</td><td data-label="Sell"><input data-currency="USD" data-field="sell" inputmode="decimal" value="1.435"></td><td data-label="Buy"><input data-currency="USD" data-field="buy" inputmode="decimal" value="1.390"></td></tr>
            <tr><td>EUR</td><td data-label="Sell"><input data-currency="EUR" data-field="sell" inputmode="decimal" value="1.649"></td><td data-label="Buy"><input data-currency="EUR" data-field="buy" inputmode="decimal" value="1.596"></td></tr>
            <tr><td>GBP</td><td data-label="Sell"><input data-currency="GBP" data-field="sell" inputmode="decimal" value="1.909"></td><td data-label="Buy"><input data-currency="GBP" data-field="buy" inputmode="decimal" value="1.855"></td></tr>
            <tr><td>JPY</td><td data-label="Sell"><input data-currency="JPY" data-field="sell" inputmode="decimal" value="0.009"></td><td data-label="Buy"><input data-currency="JPY" data-field="buy" inputmode="decimal" value="0.008"></td></tr>
            <tr><td>USDT</td><td data-label="Sell"><input data-currency="USDT" data-field="sell" inputmode="decimal" value="1.460"></td><td data-label="Buy"><input data-currency="USDT" data-field="buy" inputmode="decimal" value="1.400"></td></tr>
            <tr><td>MXN</td><td data-label="Sell"><input data-currency="MXN" data-field="sell" inputmode="decimal" value="0.084"></td><td data-label="Buy"><input data-currency="MXN" data-field="buy" inputmode="decimal" value="0.077"></td></tr>
          </tbody>
        </table>
      </div>

      <div class="section">
        <div class="actions">
          <button class="primary" id="download" type="button">Apply &amp; Download</button>
          <button class="secondary" id="apply" type="button">Preview</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </section>

    function todayISO() {
      var today = new Date();
      var month = String(today.getMonth() + 1);
      var day = String(today.getDate());
      if (month.length < 2) {
        month = "0" + month;
      }
      if (day.length < 2) {
        day = "0" + day;
      }
      return today.getFullYear() + "-" + month + "-" + day;

      document.getElementById("date").value = dateValue;
      if (stored && stored.filename) {
        document.getElementById("filename").value = stored.filename;
      }

      var tbody = document.getElementById("rates");
      var storedRates = {};
      var savedRates = stored && stored.rates ? stored.rates : [];
      var i;
      while (tbody.firstChild) {
        tbody.removeChild(tbody.firstChild);
      }

      for (i = 0; i < savedRates.length; i += 1) {
        if (savedRates[i] && savedRates[i].currency) {
          storedRates[savedRates[i].currency] = savedRates[i];
        }
      }

      for (i = 0; i < currencies.length; i += 1) {
        var currency = currencies[i][0];
        var sell = currencies[i][1];
        var buy = currencies[i][2];
        var row = storedRates[currency] || {};
        var tr = document.createElement("tr");
        var currencyCell = document.createElement("td");
        var sellCell = document.createElement("td");
        var buyCell = document.createElement("td");
        var sellInput = document.createElement("input");
        var buyInput = document.createElement("input");

        currencyCell.appendChild(document.createTextNode(currency));

        sellCell.setAttribute("data-label", "Sell");
        sellInput.setAttribute("data-currency", currency);
        sellInput.setAttribute("data-field", "sell");
        sellInput.setAttribute("inputmode", "decimal");
        sellInput.value = row.sell || sell;
        sellCell.appendChild(sellInput);

        buyCell.setAttribute("data-label", "Buy");
        buyInput.setAttribute("data-currency", currency);
        buyInput.setAttribute("data-field", "buy");
        buyInput.setAttribute("inputmode", "decimal");
        buyInput.value = row.buy || buy;
        buyCell.appendChild(buyInput);

        tr.appendChild(currencyCell);
        tr.appendChild(sellCell);
        tr.appendChild(buyCell);
        tbody.appendChild(tr);
      }
    }

    function dateAtNoon(dateString) {
      var parts = dateString.split("-");
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0);
    }

    function formatEnglishDate(dateString) {
      var date = dateAtNoon(dateString);
      var months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return date.getDate() + " " + months[date.getMonth()] + " " + date.getFullYear();
    }

    function toPersianDigits(value) {
      var digits = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
      return String(value).replace(/[0-9]/g, function (digit) {
        return digits[Number(digit)];
      });
    }

    function gregorianToJalali(gy, gm, gd) {
      var gDaysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      var jDaysInMonth = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
      var jy;
      var jm;
      var jd;
      var gy2;
      var days;
      var i;

      gy -= 1600;
      gm -= 1;
      gd -= 1;

      days = 365 * gy + Math.floor((gy + 3) / 4) - Math.floor((gy + 99) / 100) + Math.floor((gy + 399) / 400);
      for (i = 0; i < gm; i += 1) {
        days += gDaysInMonth[i];
      }
      gy2 = gy + 1600;
      if (gm > 1 && ((gy2 % 4 === 0 && gy2 % 100 !== 0) || (gy2 % 400 === 0))) {
        days += 1;
      }
      days += gd;
      days -= 79;

      jy = 979 + 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days >= 366) {
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
      }

      for (i = 0; i < 11 && days >= jDaysInMonth[i]; i += 1) {
        days -= jDaysInMonth[i];
      }
      jm = i + 1;
      jd = days + 1;
      return [jy, jm, jd];
    }

    function formatPersianDate(dateString) {
      var parts = dateString.split("-");
      var jalali = gregorianToJalali(Number(parts[0]), Number(parts[1]), Number(parts[2]));
      var months = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
      return toPersianDigits(jalali[2]) + " " + months[jalali[1] - 1] + " " + toPersianDigits(jalali[0]);
    }

    function getData() {
      var rateMap = {};
      var inputs = document.querySelectorAll("[data-currency]");
      var rates = [];
      var i;
      for (i = 0; i < inputs.length; i += 1) {
        var input = inputs[i];
        var currency = input.getAttribute("data-currency");
        var field = input.getAttribute("data-field");
        var row = rateMap[currency] || { currency: currency, sell: "", buy: "" };
        row[field] = input.value.replace(/^\s+|\s+$/g, "");
        rateMap[currency] = row;
      }

      for (i = 0; i < currencies.length; i += 1) {
        rates.push(rateMap[currencies[i][0]]);
      }

      return {
        date: document.getElementById("date").value,
        filename: document.getElementById("filename").value.replace(/^\s+|\s+$/g, "") || "norex-currency-rates.png",
        rates: rates
      };
    }

    function drawText(text, x, y, options) {
      options = options || {};
      ctx.save();
      ctx.font = options.font;
      ctx.fillStyle = options.fill;
      ctx.textAlign = options.align || "left";
      ctx.textBaseline = "top";
      ctx.direction = options.direction || "ltr";
      if (options.shadow) {
        ctx.shadowColor = options.shadow.color;
        ctx.shadowBlur = options.shadow.blur;
        ctx.shadowOffsetX = options.shadow.x;
        ctx.shadowOffsetY = options.shadow.y;
      }
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function drawFittedText(text, x, y, options) {
      var size = options.size;
      var minSize = options.minSize || size;
      var family = options.family;
      var weight = options.weight || "800";
      var font;
      ctx.save();
      while (size > minSize) {
        font = weight + " " + size + "px " + family;
        ctx.font = font;
        if (ctx.measureText(text).width <= options.maxWidth) {
          break;
        }
        size -= 1;
      }
      ctx.restore();
      options.font = weight + " " + size + "px " + family;
      drawText(text, x, y, options);
    }

    function coverDynamicAreas() {
      ctx.save();
      ctx.fillStyle = "#061936";
      ctx.fillRect(398, 384, 235, 42);
      ctx.fillRect(690, 384, 180, 42);
      ctx.restore();
    }

    function applyPoster() {
      if (!template.complete || !template.naturalWidth) {
        status.textContent = "Template is still loading.";
        return;
      }

      var data = getData();
      if (!data.date) {
        status.textContent = "Choose a date first.";
        return;
      }

      writeStoredData(data);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

      coverDynamicAreas();

      drawText(formatEnglishDate(data.date), 510, 388, {
        font: '800 32px Arial, Helvetica, sans-serif',
        fill: "#f7f7f5",
        align: "center",
        shadow: { color: "rgba(0, 0, 0, 0.35)", blur: 2, x: 0, y: 2 }
      });

      drawFittedText(formatPersianDate(data.date), 820, 389, {
        weight: "800",
        size: 27,
        minSize: 20,
        maxWidth: 170,
        family: '"SF Arabic", "Geeza Pro", "Arial Unicode MS", Arial, sans-serif',
        fill: "#f7f7f5",
        align: "right",
        direction: "rtl",
        shadow: { color: "rgba(0, 0, 0, 0.35)", blur: 2, x: 0, y: 2 }
      });

      for (var i = 0; i < data.rates.length; i += 1) {
        var row = data.rates[i];
        var pos = ratePositions[row.currency];
        drawText(row.sell, 668, pos.sellTop, {
          font: '900 42px Arial, Helvetica, sans-serif',
          fill: "#07172d"
        });
        drawText(row.buy, 668, pos.buyTop, {
          font: '900 42px Arial, Helvetica, sans-serif',
          fill: "#c8121c"
        });
      }

      posterImage.src = canvas.toDataURL("image/png");
      posterImage.style.display = "block";
      if (document.body.className.indexOf("js-ready") === -1) {
        document.body.className += (document.body.className ? " " : "") + "js-ready";
      }
      status.textContent = isIOSDevice() ? "Poster ready. Long-press the poster image to save it." : "Preview updated.";
    }

    function hasPngExtension(filename) {
      return filename.toLowerCase().slice(-4) === ".png";
    }

    function isIOSDevice() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function dataUrlToBlob(dataUrl) {
      var parts = dataUrl.split(",");
      var mime = parts[0].match(/:(.*?);/)[1];
      var binary = atob(parts[1]);
      var length = binary.length;
      var bytes = new Uint8Array(length);
      for (var i = 0; i < length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Blob([bytes], { type: mime });
    }

    function openOrDownload(blob, filename, popup) {
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      var canDownload = "download" in link && !isIOSDevice();

      if (canDownload) {
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        status.textContent = "Downloaded " + filename + ".";
        window.setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 3000);
        return;
      }

      if (popup) {
        popup.location = url;
        status.textContent = "Poster opened. Use Share or Save Image on your iPhone.";
      } else {
        window.location.href = url;
        status.textContent = "Poster opened. Use Share or Save Image on your iPhone.";
      }
    }

    function downloadPoster() {
      applyPoster();
      var data = getData();
      var filename = hasPngExtension(data.filename) ? data.filename : data.filename + ".png";
      var popup = null;

      if (isIOSDevice()) {
        status.textContent = "Poster ready. Long-press the poster image to save it.";
        return;
      }

      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          openOrDownload(blob, filename, popup);
        }, "image/png");
      } else {
        openOrDownload(dataUrlToBlob(canvas.toDataURL("image/png")), filename, popup);
      }
    }

    window.onerror = function (message) {
      status.textContent = "This browser stopped the tool: " + message;
    };

    buildRows();
    document.getElementById("apply").addEventListener("click", applyPoster);
    document.getElementById("download").addEventListener("click", downloadPoster);
    template.onload = applyPoster;
    template.onerror = function () {
      status.textContent = "Poster template could not load. Reopen the portable HTML file.";
    };
    template.src = templateUrl;
    if (template.complete && template.naturalWidth) {
      applyPoster();
    }
  </script>
</body>
