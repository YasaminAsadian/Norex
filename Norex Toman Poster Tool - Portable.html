<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Norex Toman Poster Tool</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0b1728;
      --muted: #5a6678;
      --line: #d8dde5;
      --panel: #ffffff;
      --page: #eef2f7;
      --accent: #b8872b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(340px, 460px) minmax(420px, 1fr);
      gap: 22px;
      width: min(1340px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .controls,
    .preview {
      min-width: 0;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(16, 30, 54, 0.08);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #c8d0dc;
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fbfcfe;
      font-size: 16px;
    }

    input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(184, 135, 43, 0.18);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary,
    .secondary {
      min-height: 44px;
      border-radius: 7px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 800;
      touch-action: manipulation;
    }

    .primary {
      color: #ffffff;
      background: #081a30;
      border-color: #081a30;
    }

    .secondary {
      color: var(--ink);
      background: #f9fafc;
      border-color: #c8d0dc;
    }

    .primary:hover,
    .secondary:hover {
      filter: brightness(0.96);
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .preview-frame {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    canvas {
      display: none;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(16, 30, 54, 0.2);
      background: #111111;
    }

    .poster-image {
      display: none;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(16, 30, 54, 0.2);
      background: #111111;
    }

    #template-source {
      display: block !important;
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 16px 50px rgba(16, 30, 54, 0.2);
      background: #111111;
    }

    body.js-ready #template-source {
      display: none !important;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 14px;
      }
    }

    @media (max-width: 560px) {
      .app {
        padding: 10px;
      }

      h1 {
        margin-bottom: 12px;
        font-size: 22px;
      }

      .section {
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 7px;
      }

      .field-grid,
      .actions {
        grid-template-columns: 1fr;
      }

      input {
        min-height: 46px;
        font-size: 17px;
      }

      .primary,
      .secondary {
        min-height: 48px;
      }

      canvas,
      .poster-image,
      #template-source {
        border-radius: 6px;
        box-shadow: 0 10px 28px rgba(16, 30, 54, 0.18);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="controls">
      <h1>Norex Toman Poster Tool</h1>

      <div class="section">
        <div class="field-grid">
          <label>
            English date
            <input id="english-date" type="text" value="May 16, 2026" />
          </label>
          <label>
            Farsi date
            <input id="farsi-date" type="text" dir="rtl" value="۲۶ اردیبهشت ۱۴۰۵" />
          </label>
          <label>
            Sell value
            <input id="sell-value" type="text" inputmode="numeric" value="131000" />
          </label>
          <label>
            Buy value
            <input id="buy-value" type="text" inputmode="numeric" value="127000" />
          </label>
        </div>
      </div>

      <div class="section">
        <div class="actions">
          <button class="primary" id="download" type="button">Apply &amp; Download</button>
          <button class="secondary" id="apply" type="button">Preview</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </section>

  <script>
    var templateSource = document.getElementById("template-source");
    var templateUrl = templateSource ? templateSource.src : "";
    var canvas = document.getElementById("poster");
    var ctx = canvas.getContext("2d");
    var status = document.getElementById("status");
    var posterImage = document.getElementById("poster-image");
    var template = new Image();

    function readStoredData() {
      try {
        return JSON.parse(localStorage.getItem("norexTomanPosterData") || "null");
      } catch (error) {
        return null;
      }
    }

    function writeStoredData(data) {
      try {
        localStorage.setItem("norexTomanPosterData", JSON.stringify(data));
      } catch (error) {
        return false;
      }
      return true;
    }

    function applyStoredData() {
      var stored = readStoredData();
      if (!stored) {
        return;
      }
      if (stored.englishDate) {
        document.getElementById("english-date").value = stored.englishDate;
      }
      if (stored.farsiDate) {
        document.getElementById("farsi-date").value = stored.farsiDate;
      }
      if (stored.sellValue) {
        document.getElementById("sell-value").value = stored.sellValue;
      }
      if (stored.buyValue) {
        document.getElementById("buy-value").value = stored.buyValue;
      }
      syncFarsiFromEnglish();
    }

    function trimText(value) {
      return String(value).replace(/^\s+|\s+$/g, "");
    }

    function toEnglishDigits(value) {
      var persian = "۰۱۲۳۴۵۶۷۸۹";
      var arabic = "٠١٢٣٤٥٦٧٨٩";
      return String(value).replace(/[۰-۹٠-٩]/g, function (digit) {
        var index = persian.indexOf(digit);
        if (index < 0) {
          index = arabic.indexOf(digit);
        }
        return String(index);
      });
    }

    function toPersianDigits(value) {
      var digits = ["۰", "۱", "۲", "۳", "۴", "۵", "۶", "۷", "۸", "۹"];
      return String(value).replace(/[0-9]/g, function (digit) {
        return digits[Number(digit)];
      });
    }

    function parseEnglishDateText(value) {
      var monthNames = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
      var monthShort = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
      var cleaned = trimText(value).replace(/,/g, " ").replace(/\s+/g, " ");
      var isoMatch = cleaned.match(/^([0-9]{4})-([0-9]{1,2})-([0-9]{1,2})$/);
      var parts;
      var monthIndex = -1;
      var day;
      var year;
      var i;

      if (isoMatch) {
        return new Date(Number(isoMatch[1]), Number(isoMatch[2]) - 1, Number(isoMatch[3]), 12, 0, 0);
      }

      parts = cleaned.split(" ");
      if (parts.length < 3) {
        return null;
      }

      for (i = 0; i < 12; i += 1) {
        if (parts[0].toLowerCase() === monthNames[i] || parts[0].toLowerCase() === monthShort[i]) {
          monthIndex = i;
          day = Number(toEnglishDigits(parts[1]).replace(/[^0-9]/g, ""));
          year = Number(toEnglishDigits(parts[2]).replace(/[^0-9]/g, ""));
        }
        if (parts[1] && (parts[1].toLowerCase() === monthNames[i] || parts[1].toLowerCase() === monthShort[i])) {
          monthIndex = i;
          day = Number(toEnglishDigits(parts[0]).replace(/[^0-9]/g, ""));
          year = Number(toEnglishDigits(parts[2]).replace(/[^0-9]/g, ""));
        }
      }

      if (monthIndex < 0 || !day || !year) {
        return null;
      }
      return new Date(year, monthIndex, day, 12, 0, 0);
    }

    function gregorianToJalali(gy, gm, gd) {
      var gDaysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      var jDaysInMonth = [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, 30, 29];
      var jy;
      var jm;
      var jd;
      var gy2;
      var days;
      var i;

      gy -= 1600;
      gm -= 1;
      gd -= 1;

      days = 365 * gy + Math.floor((gy + 3) / 4) - Math.floor((gy + 99) / 100) + Math.floor((gy + 399) / 400);
      for (i = 0; i < gm; i += 1) {
        days += gDaysInMonth[i];
      }
      gy2 = gy + 1600;
      if (gm > 1 && ((gy2 % 4 === 0 && gy2 % 100 !== 0) || (gy2 % 400 === 0))) {
        days += 1;
      }
      days += gd;
      days -= 79;

      jy = 979 + 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days >= 366) {
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
      }

      for (i = 0; i < 11 && days >= jDaysInMonth[i]; i += 1) {
        days -= jDaysInMonth[i];
      }
      jm = i + 1;
      jd = days + 1;
      return [jy, jm, jd];
    }

    function formatPersianDateFromDate(date) {
      var jalali = gregorianToJalali(date.getFullYear(), date.getMonth() + 1, date.getDate());
      var months = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
      return toPersianDigits(jalali[2]) + " " + months[jalali[1] - 1] + " " + toPersianDigits(jalali[0]);
    }

    function syncFarsiFromEnglish() {
      var date = parseEnglishDateText(document.getElementById("english-date").value);
      if (date) {
        document.getElementById("farsi-date").value = formatPersianDateFromDate(date);
      }
    }

    function formatMoneyText(value) {
      var cleaned = toEnglishDigits(trimText(value)).replace(/[,\u066C\u060C\s]/g, "");
      var result = "";
      var i;
      var count = 0;

      if (!/^[0-9]+$/.test(cleaned)) {
        return toPersianDigits(value);
      }

      for (i = cleaned.length - 1; i >= 0; i -= 1) {
        if (count > 0 && count % 3 === 0) {
          result = "," + result;
        }
        result = cleaned.charAt(i) + result;
        count += 1;
      }
      return toPersianDigits(result);
    }

    function getData() {
      return {
        englishDate: trimText(document.getElementById("english-date").value) || "May 16, 2026",
        farsiDate: trimText(document.getElementById("farsi-date").value) || "۲۶ اردیبهشت ۱۴۰۵",
        sellValue: trimText(document.getElementById("sell-value").value) || "131000",
        buyValue: trimText(document.getElementById("buy-value").value) || "127000"
      };
    }

    function fillRoundRect(x, y, width, height, radius, fillStyle) {
      ctx.save();
      ctx.fillStyle = fillStyle;
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function coverDateArea() {
      var gradient = ctx.createLinearGradient(0, 292, 0, 360);
      gradient.addColorStop(0, "#d7ad5d");
      gradient.addColorStop(0.48, "#c8913d");
      gradient.addColorStop(1, "#e1b65f");
      fillRoundRect(194, 292, 866, 70, 24, gradient);
      ctx.save();
      ctx.fillStyle = "#090909";
      ctx.fillRect(651, 304, 4, 48);
      ctx.restore();
    }

    function coverValueArea(x) {
      ctx.save();
      ctx.shadowColor = "#070707";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#070707";
      ctx.fillRect(x, 698, 395, 126);
      ctx.restore();
    }

    function drawText(text, x, y, options) {
      options = options || {};
      ctx.save();
      ctx.font = options.font;
      ctx.fillStyle = options.fill;
      ctx.textAlign = options.align || "left";
      ctx.textBaseline = options.baseline || "top";
      ctx.direction = options.direction || "ltr";
      if (options.shadow) {
        ctx.shadowColor = options.shadow.color;
        ctx.shadowBlur = options.shadow.blur;
        ctx.shadowOffsetX = options.shadow.x;
        ctx.shadowOffsetY = options.shadow.y;
      }
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function measureTextSequence(text, tracking) {
      var chars = String(text).split("");
      var width = 0;
      for (var i = 0; i < chars.length; i += 1) {
        width += ctx.measureText(chars[i]).width;
        if (i < chars.length - 1) {
          width += tracking;
        }
      }
      return width;
    }

    function drawTextSequence(text, x, y, options) {
      var chars = String(text).split("");
      var size = options.size;
      var minSize = options.minSize || size;
      var family = options.family;
      var weight = options.weight || "900";
      var tracking = options.tracking || 0;
      var font;
      var width;
      var startX;
      var i;

      ctx.save();
      while (size > minSize) {
        font = weight + " " + size + "px " + family;
        ctx.font = font;
        width = measureTextSequence(text, tracking);
        if (!options.maxWidth || width <= options.maxWidth) {
          break;
        }
        size -= 1;
      }

      ctx.font = weight + " " + size + "px " + family;
      width = measureTextSequence(text, tracking);
      ctx.fillStyle = options.fill;
      ctx.textAlign = "left";
      ctx.textBaseline = options.baseline || "top";
      ctx.direction = "ltr";
      if (options.shadow) {
        ctx.shadowColor = options.shadow.color;
        ctx.shadowBlur = options.shadow.blur;
        ctx.shadowOffsetX = options.shadow.x;
        ctx.shadowOffsetY = options.shadow.y;
      }

      startX = options.align === "right" ? x - width : x - width / 2;
      for (i = 0; i < chars.length; i += 1) {
        ctx.fillText(chars[i], startX, y);
        startX += ctx.measureText(chars[i]).width + tracking;
      }
      ctx.restore();
    }

    function applyPoster() {
      if (!template.complete || !template.naturalWidth) {
        status.textContent = "Template is still loading.";
        return;
      }

      syncFarsiFromEnglish();
      var data = getData();
      writeStoredData(data);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

      coverDateArea();
      coverValueArea(205);
      coverValueArea(635);

      drawText(data.englishDate, 435, 306, {
        font: "900 53px Arial, Helvetica, sans-serif",
        fill: "#070707",
        align: "center",
        shadow: { color: "rgba(255, 232, 160, 0.22)", blur: 1, x: 0, y: 1 }
      });

      drawText(data.farsiDate, 865, 310, {
        font: '900 42px "SF Arabic", "Geeza Pro", "Arial Unicode MS", Arial, sans-serif',
        fill: "#070707",
        align: "center",
        direction: "rtl",
        shadow: { color: "rgba(255, 232, 160, 0.18)", blur: 1, x: 0, y: 1 }
      });

      drawTextSequence(formatMoneyText(data.sellValue), 400, 715, {
        weight: "900",
        size: 84,
        minSize: 68,
        maxWidth: 350,
        family: 'Arial, "Arial Unicode MS", Tahoma, Helvetica, sans-serif',
        fill: "#f7f7f7",
        align: "center",
        tracking: -2,
        shadow: { color: "rgba(0, 0, 0, 0.8)", blur: 8, x: 0, y: 6 }
      });

      drawTextSequence(formatMoneyText(data.buyValue), 835, 715, {
        weight: "900",
        size: 84,
        minSize: 68,
        maxWidth: 350,
        family: 'Arial, "Arial Unicode MS", Tahoma, Helvetica, sans-serif',
        fill: "#f7f7f7",
        align: "center",
        tracking: -2,
        shadow: { color: "rgba(0, 0, 0, 0.8)", blur: 8, x: 0, y: 6 }
      });

      drawText("(برای مبالغ بالای ۵۰۰ دلار)", 835, 805, {
        font: '800 25px "SF Arabic", "Geeza Pro", "Arial Unicode MS", Arial, sans-serif',
        fill: "#e9bd67",
        align: "center",
        direction: "rtl",
        shadow: { color: "rgba(0, 0, 0, 0.85)", blur: 4, x: 0, y: 3 }
      });

      posterImage.src = canvas.toDataURL("image/png");
      posterImage.style.display = "block";
      if (document.body.className.indexOf("js-ready") === -1) {
        document.body.className += (document.body.className ? " " : "") + "js-ready";
      }
      status.textContent = isIOSDevice() ? "Poster ready. Long-press the poster image to save it." : "Preview updated.";
    }

    function isIOSDevice() {
      return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function dataUrlToBlob(dataUrl) {
      var parts = dataUrl.split(",");
      var mime = parts[0].match(/:(.*?);/)[1];
      var binary = atob(parts[1]);
      var length = binary.length;
      var bytes = new Uint8Array(length);
      for (var i = 0; i < length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Blob([bytes], { type: mime });
    }

    function openOrDownload(blob, filename) {
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      var canDownload = "download" in link && !isIOSDevice();

      if (canDownload) {
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        status.textContent = "Downloaded " + filename + ".";
        window.setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 3000);
        return;
      }

      window.location.href = url;
      status.textContent = "Poster opened. Use Share or Save Image on your iPhone.";
    }

    function downloadPoster() {
      applyPoster();
      if (isIOSDevice()) {
        status.textContent = "Poster ready. Long-press the poster image to save it.";
        return;
      }

      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          openOrDownload(blob, "norex-toman-poster.png");
        }, "image/png");
      } else {
        openOrDownload(dataUrlToBlob(canvas.toDataURL("image/png")), "norex-toman-poster.png");
      }
    }

    window.onerror = function (message) {
      status.textContent = "This browser stopped the tool: " + message;
    };

    applyStoredData();
    syncFarsiFromEnglish();
    document.getElementById("english-date").addEventListener("input", syncFarsiFromEnglish);
    document.getElementById("english-date").addEventListener("change", syncFarsiFromEnglish);
    document.getElementById("apply").addEventListener("click", applyPoster);
    document.getElementById("download").addEventListener("click", downloadPoster);
    template.onload = applyPoster;
    template.onerror = function () {
      status.textContent = "Poster template could not load. Reopen the portable HTML file.";
    };
    template.src = templateUrl;
    if (template.complete && template.naturalWidth) {
      applyPoster();
    }
  </script>
</body>
</html>
